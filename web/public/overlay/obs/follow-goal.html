<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OBS Follow Goal</title>
    <style>
      html,body{ margin:0; padding:0; background:transparent; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .wrap{
        width: 100%;
        padding: 12px;
        box-sizing: border-box;
      }
      .card{
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.10);
        background: rgba(0,0,0,0.22);
        box-shadow: 0 16px 50px rgba(0,0,0,0.35);
        padding: 12px;
      }
      .top{
        display:flex;
        justify-content:space-between;
        gap: 10px;
        align-items:baseline;
        margin-bottom: 10px;
      }
      .title{
        font-weight: 950;
        color: white;
        opacity: 0.95;
        font-size: 14px;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
      }
      .count{
        font-weight: 950;
        color: white;
        opacity: 0.85;
        font-size: 12px;
        flex: 0 0 auto;
      }
      .bar{
        height: 12px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.10);
        background: rgba(0,0,0,0.20);
        overflow:hidden;
      }
      .fill{
        height:100%;
        width: 0%;
        background: var(--fg, #7C4DFF);
        transition: width 500ms ease;
      }
      .sub{
        margin-top: 8px;
        font-size: 12px;
        color: white;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="top">
          <div class="title" id="name">Follow goal</div>
          <div class="count" id="count">0 / 100</div>
        </div>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="sub" id="sub">Aperçu statique (les routes suivront)</div>
      </div>
    </div>

    <script>
      const qs = new URLSearchParams(location.search);
      const name = qs.get("name") || "Follow goal";
      const target = Math.max(1, parseInt(qs.get("target") || "100", 10));
      const fg = qs.get("fg") ? `#${String(qs.get("fg")).replace(/^#/,"")}` : "#7C4DFF";
      const cur = Math.max(0, Math.min(target, parseInt(qs.get("cur") || String(Math.round(target*0.35)), 10)));

      document.documentElement.style.setProperty("--fg", fg);
      document.getElementById("name").textContent = name;
      document.getElementById("count").textContent = `${cur} / ${target}`;
      document.getElementById("fill").style.width = `${Math.round((cur/target)*100)}%`;
    </script>
  </body>
</html>
