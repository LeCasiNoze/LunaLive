<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OBS Viewers</title>
    <style>
      html,body{ margin:0; padding:0; background:transparent; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .pill{
        display:inline-flex;
        align-items:center;
        gap:10px;
        padding: 10px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.10);
        background: rgba(0,0,0,0.22);
        box-shadow: 0 16px 50px rgba(0,0,0,0.35);
        color: var(--fg, #ffffff);
        font-weight: 950;
        font-size: 14px;
      }
      .dot{
        width: 10px; height: 10px; border-radius:999px;
        background: rgba(255,255,255,0.22);
        border: 1px solid rgba(255,255,255,0.18);
      }
      .muted{
        opacity:0.75;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <div class="pill">
      <span class="dot"></span>
      <span>Viewers</span>
      <span class="muted" id="v">0</span>
    </div>

    <script>
      const qs = new URLSearchParams(location.search);
      const fg = qs.get("fg") ? `#${String(qs.get("fg")).replace(/^#/,"")}` : "#FFFFFF";
      const cur = parseInt(qs.get("cur") || "42", 10);
      document.documentElement.style.setProperty("--fg", fg);
      document.getElementById("v").textContent = String(Math.max(0, cur));
    </script>
  </body>
</html>
