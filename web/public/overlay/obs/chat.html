<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OBS Chat</title>
    <style>
      :root{
        --uname:#7C4DFF;
        --msg:#FFFFFF;
        --bg: rgba(0,0,0,0);
        --shadow: rgba(0,0,0,0.35);
      }
      html,body{ margin:0; padding:0; background:transparent; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      body{ overflow:hidden; }
      .root{
        width: var(--mw, 420px);
        transform-origin: bottom left;
        transform: scale(var(--scale, 1));
      }
      .stack{
        display:flex;
        flex-direction:column;
        gap:10px;
        padding: 10px;
        align-items:flex-start;
      }
      .msg{
        display:flex;
        gap:10px;
        align-items:flex-start;
        max-width:100%;
      }
      .ava{
        width:36px; height:36px;
        border-radius:999px;
        display:flex; align-items:center; justify-content:center;
        background: rgba(255,255,255,0.10);
        border:1px solid rgba(255,255,255,0.12);
        color: rgba(255,255,255,0.9);
        font-weight:900;
        flex: 0 0 auto;
        box-shadow: 0 10px 22px var(--shadow);
      }
      .bubble{
        border-radius:16px;
        padding:10px 12px;
        border:1px solid rgba(255,255,255,0.10);
        background: rgba(0,0,0,0.28);
        box-shadow: 0 10px 22px var(--shadow);
        max-width: calc(100% - 50px);
      }
      .top{
        display:flex;
        gap:10px;
        align-items:baseline;
        justify-content:space-between;
        margin-bottom:6px;
      }
      .uname{
        font-weight:950;
        color: var(--uname);
        font-size: calc(var(--font, 22px) * 0.82);
        line-height: 1.1;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
        max-width: 260px;
      }
      .time{
        font-size: 12px;
        opacity:0.65;
        color:white;
        flex: 0 0 auto;
      }
      .body{
        color: var(--msg);
        opacity:0.95;
        font-size: var(--font, 22px);
        line-height: var(--lh, 1.3);
        word-break: break-word;
      }
      .hint{
        color:white;
        opacity:0.55;
        font-size:12px;
        padding: 0 10px 10px 10px;
      }
    </style>
  </head>
  <body>
    <div class="root" id="root">
      <div class="stack" id="stack"></div>
      <div class="hint" id="hint"></div>
    </div>

    <script>
      const qs = new URLSearchParams(location.search);
      const token = qs.get("token") || "";
      const api = (qs.get("api") || "https://lunalive-api.onrender.com").replace(/\/+$/,"");
      const mw = parseInt(qs.get("mw") || "420", 10);
      const scale = parseFloat(qs.get("scale") || "1");
      const font = parseInt(qs.get("font") || "22", 10);
      const lh = parseFloat(qs.get("lh") || "1.3");

      document.documentElement.style.setProperty("--mw", `${Math.max(260, mw)}px`);
      document.documentElement.style.setProperty("--scale", String(Math.max(0.3, scale)));
      document.documentElement.style.setProperty("--font", `${Math.max(10, font)}px`);
      document.documentElement.style.setProperty("--lh", String(Math.max(0.9, lh)));

      const stack = document.getElementById("stack");
      const hint = document.getElementById("hint");

      function initials(name){
        const s = String(name||"").trim();
        if(!s) return "??";
        const parts = s.split(/\s+/).slice(0,2);
        return parts.map(p=>p[0].toUpperCase()).join("");
      }

      function renderSample(){
        const now = new Date();
        const hh = String(now.getHours()).padStart(2,"0");
        const mm = String(now.getMinutes()).padStart(2,"0");
        const rows = [
          { u:"ViewerOne", m:"Yo 👋" },
          { u:"LeCasiNoze", m:"Test overlay chat (style streamer) ✅" },
          { u:"MoonKid", m:"Ça rend propre en OBS !" },
        ];
        stack.innerHTML = rows.map(r => `
          <div class="msg">
            <div class="ava">${initials(r.u)}</div>
            <div class="bubble">
              <div class="top">
                <div class="uname" title="${r.u}">${r.u}</div>
                <div class="time">${hh}:${mm}</div>
              </div>
              <div class="body">${r.m}</div>
            </div>
          </div>
        `).join("");
      }

      async function loadStreamerAppearance(){
        if(!token) {
          hint.textContent = "Token manquant (URL OBS). Aperçu en mode sample.";
          return;
        }
        try{
          const r = await fetch(`${api}/streamer/me/appearance`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          const j = await r.json();
          if(!j || !j.ok) throw new Error(j?.error || "appearance_failed");
          const ap = j.appearance || j.streamer?.appearance;
          const chat = ap?.chat || {};
          const uname = chat.usernameColor || "#7C4DFF";
          const msg = chat.messageColor || "#FFFFFF";
          document.documentElement.style.setProperty("--uname", uname);
          document.documentElement.style.setProperty("--msg", msg);
          hint.textContent = "Couleurs chargées depuis l'apparence streamer ✅";
        } catch(e){
          hint.textContent = "Impossible de charger l'apparence (fallback).";
        }
      }

      renderSample();
      loadStreamerAppearance();
    </script>
  </body>
</html>
