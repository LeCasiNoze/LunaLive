<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OBS Alerts</title>

  <style>
    html,body{
      margin:0; padding:0;
      background:transparent;
      width:100%; height:100%;
      overflow:hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:white;
    }

    .stage{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }

    .wrap{
      width:min(760px, 96vw);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 12px;
      opacity:0;
      transform: translateY(10px) scale(0.98);
      transition: opacity 180ms ease, transform 220ms ease;
    }

    .wrap.on{
      opacity:1;
      transform: translateY(0) scale(1);
    }

    /* GROS média au dessus */
    .media{
      width:min(560px, 92vw);
      max-height: 420px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius: 22px;
      overflow:hidden;

      /* look luna */
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 18px 70px rgba(0,0,0,0.55);
    }

    .media img{
      width:100%;
      height:auto;
      max-height: 420px;
      object-fit: contain;
      display:block;
    }

    /* Texte en dessous, pas “petite case” */
    .textBox{
      width:100%;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.22);
      box-shadow: 0 16px 60px rgba(0,0,0,0.45);
      padding: 14px 16px;
      text-align:center;
    }

    .txt{
      font-weight: 950;
      font-size: 20px;
      line-height: 1.15;
      letter-spacing: 0.2px;
      text-shadow: 0 2px 16px rgba(0,0,0,0.45);
    }

    .sub{
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.55;
    }

    /* Petit shimmer discret */
    @keyframes shimmer {
      0% { filter: brightness(1); }
      50% { filter: brightness(1.08); }
      100% { filter: brightness(1); }
    }
    .wrap.on .media{ animation: shimmer 1600ms ease-in-out infinite; }
  </style>
</head>

<body>
  <div class="stage">
    <div class="wrap" id="wrap">
      <div class="media" id="media" style="display:none;">
        <img id="img" alt="alert media" />
      </div>

      <div class="textBox">
        <div class="txt" id="t">Alerte…</div>
        <div class="sub" id="s">En attente d’événements</div>
      </div>
    </div>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);
    const API_BASE = (qs.get("api") || location.origin).replace(/\/+$/, "");
    const slug = (qs.get("slug") || "").trim();
    const poll = Math.max(1000, parseInt(qs.get("poll") || "8000", 10));

    const wrap = document.getElementById("wrap");
    const media = document.getElementById("media");
    const img = document.getElementById("img");
    const t = document.getElementById("t");
    const s = document.getElementById("s");

    // Queue pour éviter que 2 alertes se chevauchent
    const queue = [];
    let playing = false;
    let hideTimer = null;

    function show() {
      wrap.classList.add("on");
    }
    function hide() {
      wrap.classList.remove("on");
      // on nettoie après transition
      window.setTimeout(() => {
        t.textContent = "";
        s.textContent = "En attente d’événements";
        media.style.display = "none";
        img.removeAttribute("src");
      }, 180);
    }

    function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

    async function getAudioDurationMs(soundUrl) {
      // Si pas de son => 7000ms direct
      if (!soundUrl) return 7000;

      // Essaie de lire la vraie durée (metadata)
      return await new Promise((resolve) => {
        let done = false;

        const a = new Audio();
        a.preload = "metadata";
        a.src = soundUrl;

        const finish = (ms) => {
          if (done) return;
          done = true;
          try { a.pause(); } catch {}
          resolve(ms);
        };

        a.addEventListener("loadedmetadata", () => {
          const d = Number(a.duration);
          if (Number.isFinite(d) && d > 0) finish(Math.ceil(d * 1000));
          else finish(7000);
        });

        a.addEventListener("error", () => finish(7000));

        // OBS/Browser parfois capricieux => timeout metadata
        setTimeout(() => finish(7000), 1500);
      });
    }

    async function playSound(soundUrl, volume) {
      if (!soundUrl) return null;
      const a = new Audio(soundUrl);
      a.volume = Math.max(0, Math.min(1, Number(volume ?? 1)));
      a.preload = "auto";
      try {
        await a.play();
      } catch {
        // autoplay peut échouer en navigateur normal (OBS ok en général)
      }
      return a;
    }

    async function playOne(payload) {
      clearTimeout(hideTimer);
      show();

      const text = String(payload?.text || payload?.message || "Alerte");
      const imageUrl = payload?.imageUrl || null;
      const soundUrl = payload?.soundUrl || null;
      const volume = payload?.volume ?? 1;

      t.textContent = text;
      s.textContent = payload?.event ? `Événement: ${payload.event}` : "";

      // Média au dessus
      if (imageUrl) {
        media.style.display = "flex";
        img.src = imageUrl;
      } else {
        media.style.display = "none";
        img.removeAttribute("src");
      }

      // Durée = durée réelle du son si présent, sinon 7s
      const durationMs = await getAudioDurationMs(soundUrl);

      // lance le son (en parallèle)
      playSound(soundUrl, volume);

      // garde à l'écran jusqu'à fin son (ou 7s)
      hideTimer = setTimeout(() => hide(), durationMs);
      await sleep(durationMs + 220);
    }

    async function pump() {
      if (playing) return;
      playing = true;
      try {
        while (queue.length) {
          const p = queue.shift();
          await playOne(p);
        }
      } finally {
        playing = false;
      }
    }

    // --- MODE SOCKET (prod) ---
    // Le serveur émet `obs:alert` dans la room `stream:{slug}`
    // On se connecte au socket.io du même host que l'API (API_BASE)
    let socket = null;
    function connectSocket() {
      // charge socket.io client depuis l'API (si ton app le sert)
      const script = document.createElement("script");
      script.src = `${API_BASE}/socket.io/socket.io.js`;
      script.async = true;
      script.onload = () => {
        socket = window.io(API_BASE, { transports: ["websocket", "polling"] });

        socket.on("connect", () => {
          s.textContent = "Connecté ✓";
          if (slug) {
            socket.emit("stream:join", { slug }, (ack) => {
              if (!ack?.ok) s.textContent = "Join stream: échec";
            });
          } else {
            s.textContent = "slug manquant (URL)";
          }
        });

        socket.on("disconnect", () => {
          s.textContent = "Déconnecté…";
        });

        socket.on("obs:alert", (payload) => {
          queue.push(payload);
          pump();
        });
      };

      script.onerror = () => {
        s.textContent = "Socket client introuvable";
      };

      document.head.appendChild(script);
    }

    connectSocket();

    // --- MODE “preview” fallback ---
    // Si tu ouvres l'URL en navigateur sans socket, tu peux simuler via query:
    // ?event=follow&name=Viewer
    const previewEvent = (qs.get("event") || "").trim();
    if (previewEvent) {
      const name = qs.get("name") || (previewEvent === "donation" ? "TestDonor" : "TestFollower");
      const text = previewEvent === "donation"
        ? `Merci ${name} pour la donation 🫶`
        : `Merci @${name} pour le follow 💜`;

      // petit auto preview après 400ms (si jamais socket pas prêt)
      setTimeout(() => {
        queue.push({ event: previewEvent, text, imageUrl: null, soundUrl: null, volume: 1 });
        pump();
      }, 400);
    }
  </script>
</body>
</html>
