<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OBS Alerts</title>
    <style>
      html,body{ margin:0; padding:0; background:transparent; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .box{
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.10);
        background: rgba(0,0,0,0.22);
        box-shadow: 0 16px 60px rgba(0,0,0,0.45);
        padding: 14px 16px;
        color:white;
        display:inline-flex;
        gap: 10px;
        align-items:center;
      }
      .badge{
        width: 36px; height: 36px; border-radius: 14px;
        display:flex; align-items:center; justify-content:center;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(124,77,255,0.18);
        font-size: 18px;
      }
      .txt{
        font-weight: 950;
        font-size: 14px;
        opacity: 0.95;
      }
      .sub{
        font-size: 12px;
        opacity: 0.65;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="badge">✨</div>
      <div>
        <div class="txt" id="t">Merci @Viewer pour le follow 💜</div>
        <div class="sub">Aperçu statique (tests via API ensuite)</div>
      </div>
    </div>

    <script>
      const qs = new URLSearchParams(location.search);
      const ev = qs.get("event") || "follow";
      const name = qs.get("name") || (ev === "donation" ? "TestDonor" : "TestFollower");
      document.getElementById("t").textContent =
        ev === "donation"
          ? `Merci ${name} pour la donation 🫶`
          : `Merci @${name} pour le follow 💜`;
    </script>
  </body>
</html>
