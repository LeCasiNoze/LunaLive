<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OBS Alerts</title>

  <style>
    html,body{
      margin:0; padding:0;
      background:transparent;
      width:100%; height:100%;
      overflow:hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:white;
    }

    .stage{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }

    .wrap{
      width:min(760px, 96vw);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 12px;
      opacity:0;
      transform: translateY(10px) scale(0.98);
      transition: opacity 180ms ease, transform 220ms ease;
    }

    .wrap.on{
      opacity:1;
      transform: translateY(0) scale(1);
    }

    .media{
      width:min(560px, 92vw);
      max-height: 420px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius: 22px;
      overflow:hidden;

      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 18px 70px rgba(0,0,0,0.55);
    }

    .media img{
      width:100%;
      height:auto;
      max-height: 420px;
      object-fit: contain;
      display:block;
    }

    .textBox{
      width:100%;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.22);
      box-shadow: 0 16px 60px rgba(0,0,0,0.45);
      padding: 14px 16px;
      text-align:center;
    }

    .txt{
      font-weight: 950;
      font-size: 20px;
      line-height: 1.15;
      letter-spacing: 0.2px;
      text-shadow: 0 2px 16px rgba(0,0,0,0.45);
    }

    .sub{
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.55;
    }

    @keyframes shimmer {
      0% { filter: brightness(1); }
      50% { filter: brightness(1.08); }
      100% { filter: brightness(1); }
    }
    .wrap.on .media{ animation: shimmer 1600ms ease-in-out infinite; }
  </style>
</head>

<body>
  <div class="stage">
    <div class="wrap" id="wrap">
      <div class="media" id="media" style="display:none;">
        <img id="img" alt="alert media" />
      </div>

      <div class="textBox">
        <div class="txt" id="t">Alerte…</div>
        <div class="sub" id="s">Initialisation…</div>
      </div>
    </div>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);

    // API base (le serveur socket.io est sur l'API)
    const API_BASE = (qs.get("api") || location.origin).replace(/\/+$/, "");

    // Params
    const slug = (qs.get("slug") || "").trim();
    const token = (qs.get("token") || "").trim(); // ✅ IMPORTANT: utilisé pour auth/join côté socket
    const uid = (qs.get("uid") || "").trim();

    // Filtre "écoute"
    // ✅ listen=follow|donation|all (remplace l'ancien event=... qui servait à preview)
    const listen = (qs.get("listen") || "all").trim().toLowerCase();
    const listenAll = (listen === "all" || listen === "*" || !listen);

    const poll = Math.max(1000, parseInt(qs.get("poll") || "8000", 10));

    const wrap = document.getElementById("wrap");
    const media = document.getElementById("media");
    const img = document.getElementById("img");
    const t = document.getElementById("t");
    const s = document.getElementById("s");

    // Queue anti-chevauchement
    const queue = [];
    let playing = false;
    let hideTimer = null;

    function show() { wrap.classList.add("on"); }
    function hide() {
      wrap.classList.remove("on");
      window.setTimeout(() => {
        t.textContent = "";
        s.textContent = "En attente d’événements";
        media.style.display = "none";
        img.removeAttribute("src");
      }, 180);
    }

    function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

    async function getAudioDurationMs(soundUrl) {
      if (!soundUrl) return 7000;
      return await new Promise((resolve) => {
        let done = false;
        const a = new Audio();
        a.preload = "metadata";
        a.src = soundUrl;

        const finish = (ms) => {
          if (done) return;
          done = true;
          try { a.pause(); } catch {}
          resolve(ms);
        };

        a.addEventListener("loadedmetadata", () => {
          const d = Number(a.duration);
          if (Number.isFinite(d) && d > 0) finish(Math.ceil(d * 1000));
          else finish(7000);
        });

        a.addEventListener("error", () => finish(7000));
        setTimeout(() => finish(7000), 1500);
      });
    }

    async function playSound(soundUrl, volume) {
      if (!soundUrl) return null;
      const a = new Audio(soundUrl);
      a.volume = Math.max(0, Math.min(1, Number(volume ?? 1)));
      a.preload = "auto";
      try { await a.play(); } catch {}
      return a;
    }

    function shouldAccept(payload) {
      const ev = String(payload?.event || "").toLowerCase();
      if (!ev) return true;
      if (listenAll) return true;
      return ev === listen; // follow ou donation
    }

    async function playOne(payload) {
      clearTimeout(hideTimer);
      show();

      const text = String(payload?.text || payload?.message || "Alerte");
      const imageUrl = payload?.imageUrl || null;
      const soundUrl = payload?.soundUrl || null;
      const volume = payload?.volume ?? 1;

      t.textContent = text;
      s.textContent = payload?.event ? `Événement: ${payload.event}` : "";

      if (imageUrl) {
        media.style.display = "flex";
        img.src = imageUrl;
      } else {
        media.style.display = "none";
        img.removeAttribute("src");
      }

      // ✅ durée: si backend fournit durationMs on la respecte,
      // sinon on calcule via metadata, sinon fallback 7s
      let durationMs = Number(payload?.durationMs ?? payload?.duration_ms ?? 0) || 0;
      if (durationMs < 200) {
        durationMs = await getAudioDurationMs(soundUrl);
      } else {
        // si un son plus long est détecté, on peut prendre le max (optionnel)
        const metaMs = await getAudioDurationMs(soundUrl);
        durationMs = Math.max(durationMs, metaMs);
      }
      durationMs = Math.max(1200, Math.min(20_000, durationMs)); // clamp

      playSound(soundUrl, volume);

      hideTimer = setTimeout(() => hide(), durationMs);
      await sleep(durationMs + 220);
    }

    async function pump() {
      if (playing) return;
      playing = true;
      try {
        while (queue.length) {
          const p = queue.shift();
          if (!shouldAccept(p)) continue;
          await playOne(p);
        }
      } finally {
        playing = false;
      }
    }

    // ---- SOCKET MODE (prod) ----
    // backend doit gérer `stream:join` et join room `stream:${slugLower}`
    let socket = null;

    function connectSocket() {
      s.textContent = "Connexion…";

      const script = document.createElement("script");
      script.src = `${API_BASE}/socket.io/socket.io.js`;
      script.async = true;

      script.onload = () => {
        // ✅ auth token transmis (compatible avec tryAuth() côté serveur)
        socket = window.io(API_BASE, {
          transports: ["websocket", "polling"],
          auth: token ? { token } : undefined,
        });

        socket.on("connect", () => {
          s.textContent = "Socket connecté ✓";

          if (!slug) {
            s.textContent = "slug manquant (URL)";
            return;
          }

          // ✅ join + ack (slug + token + uid)
          socket.emit("stream:join", { slug, token, uid }, (ack) => {
            if (!ack?.ok) {
              s.textContent = `Join stream: échec (${ack?.error || "unknown"})`;
            } else {
              s.textContent = "En attente d’événements";
            }
          });
        });

        socket.on("disconnect", () => {
          s.textContent = "Déconnecté…";
        });

        socket.on("connect_error", (err) => {
          s.textContent = `Erreur socket: ${String(err?.message || "connect_error")}`;
        });

        socket.on("obs:alert", (payload) => {
          queue.push(payload);
          pump();
        });

        // sécurité: si un jour tu changes le nom côté serveur, on écoute aussi ça
        socket.on("obs_alert", (payload) => { queue.push(payload); pump(); });
        socket.on("alert", (payload) => { queue.push(payload); pump(); });
      };

      script.onerror = () => {
        s.textContent = "Socket client introuvable (API?)";
      };

      document.head.appendChild(script);
    }

    connectSocket();

    // ---- PREVIEW (dev uniquement) ----
    // ✅ Preview manuelle : ?preview=follow&name=Viewer
    const preview = (qs.get("preview") || "").trim().toLowerCase();
    if (preview) {
      const name = qs.get("name") || (preview === "donation" ? "TestDonor" : "TestFollower");
      const text = preview === "donation"
        ? `Merci ${name} pour la donation 🫶`
        : `Merci @${name} pour le follow 💜`;

      setTimeout(() => {
        queue.push({
          event: preview,
          text,
          imageUrl: null,
          soundUrl: null,
          volume: 1,
          durationMs: 2500,
        });
        pump();
      }, 400);
    }
  </script>
</body>
</html>
