# render.yaml — LunaLive web service configuration
#
# ⚠️  Ce fichier sert de référence IaC pour Render.
#     Il ne s'applique PAS automatiquement à un service existant créé via le dashboard.
#     Pour l'activer : Render Dashboard > Settings > Render.yaml > Enable IaC sync
#     OU recréer le service manuellement avec ces paramètres.
#
# Migration static → node (web service) :
#   Raison : les Static Sites Render ne supportent pas les redirections basées sur le Host.
#   serve.js gère : redirect *.onrender.com → lunalive.win + fichiers statiques + SPA fallback.
#   Les security headers sont désormais injectés par serve.js (pas disponibles en render.yaml pour env:node).

services:
  - type: web
    name: lunalive          # ⚠️ Vérifier que ce nom correspond au service dans le dashboard
    env: node
    nodeVersion: 20
    buildCommand: cd web && npm install && npm run build
    startCommand: node serve.js
    pullRequestPreviewsEnabled: false

  - type: web
    name: landaurax
    runtime: static
    branch: main
    buildCommand: cd landaurax && npm ci && npm run build
    staticPublishPath: landaurax/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
