<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Landaurax</title>
    <meta name="landaurax-build" content="m16-webp-spa-rewrite-v2" />
    <meta name="robots" content="noindex,nofollow" />

    <!-- Preconnect API (kill TLS handshake latency on first call) -->
    <link rel="preconnect" href="https://lunalive-api.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://lunalive-api.onrender.com" />

    <!-- Fonts (non-blocking async load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=Bebas+Neue&family=Anton&family=Oswald:wght@400;600;700&family=Russo+One&family=Black+Ops+One&family=Bagel+Fat+One&family=Lobster&family=Fredoka:wght@500;600;700&family=Righteous&family=Permanent+Marker&family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@500;700;900&family=Audiowide&family=Syne:wght@500;700;800&family=Playfair+Display:wght@500;700;900&family=DM+Serif+Display&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=Bebas+Neue&family=Anton&family=Oswald:wght@400;600;700&family=Russo+One&family=Black+Ops+One&family=Bagel+Fat+One&family=Lobster&family=Fredoka:wght@500;600;700&family=Righteous&family=Permanent+Marker&family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@500;700;900&family=Audiowide&family=Syne:wght@500;700;800&family=Playfair+Display:wght@500;700;900&family=DM+Serif+Display&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Prefetch ASAP (before React boots) — chaine API JSON + template HTML
         pour que tout soit deja en cache au moment du render. -->
    <script>
    (function(){
      try {
        var p = (window.location.pathname || "").replace(/^\/+|\/+$/g, "");
        if (!p) return;
        var slug = p.split("/")[0];
        if (slug.indexOf("__") === 0) return;
        if (!/^[a-z0-9_-]+$/i.test(slug)) return;
        var base = "https://lunalive-api.onrender.com";
        var url = base + "/api/public/affi-pages/" + encodeURIComponent(slug);
        window.__affiPrefetch = window.__affiPrefetch || {};
        window.__affiPrefetch[slug.toLowerCase()] =
          fetch(url, { credentials: "omit", mode: "cors" })
            .then(function(r){ return r.ok ? r.json() : null; })
            .then(function(data){
              // Chain template HTML prefetch (V1 only — V2 ne lit pas de template).
              // Le fetch est best-effort, fire-and-forget : le browser cache HTTP
              // se chargera de servir la reponse au render React.
              try {
                if (data && data.ok && data.page && data.page.editorVersion !== 2) {
                  var m = Number(data.page.model || 5);
                  fetch("/affi_templates/model" + m + ".html").catch(function(){});
                }
              } catch(_) {}
              return data;
            })
            .catch(function(){ return null; });
      } catch(_) {}
    })();
    </script>
  </head>
  <body>
    <div id="root" style="background:#0b0911;min-height:100dvh"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
